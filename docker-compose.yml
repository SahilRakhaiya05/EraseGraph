name: erasegraph-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erasegraph
      POSTGRES_USER: erasegraph
      POSTGRES_PASSWORD: erasegraph_local
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erasegraph -d erasegraph"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - erasegraph-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erasegraph_local
      MINIO_ROOT_PASSWORD: erasegraph_local_secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - erasegraph-minio:/data

volumes:
  erasegraph-postgres:
  erasegraph-minio:

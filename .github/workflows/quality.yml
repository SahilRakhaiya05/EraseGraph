name: EraseGraph quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: |
            services/erasegraph-mcp/package-lock.json
            apps/web/package-lock.json

      - name: Install control-plane dependencies
        run: npm --prefix services/erasegraph-mcp ci

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Run complete quality gate
        run: npm run check
